<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Peptídeos</title>
<meta name="description" content="Controle de peptídeos, peso, medidas, exames, treino e suplementos.">
<meta name="theme-color" content="#0D6B62">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de coluna única para celular, abas fixas embaixo; cartões só para objetos reais (frasco, dose, foto) */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E7EDEB; --ink:#14201E; --muted:#5B6B68; --line:#D6E0DD;
  --accent:#0D6B62; --accent-ink:#FFFFFF; --accent-soft:#D9EEEA;
  --ok:#2D7A4C; --ok-soft:#DCEFE3; --warn:#A35A0A; --warn-soft:#FAEAD6; --bad:#B23B3B; --bad-soft:#F7DEDE;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211F; --sunk:#1E2A27; --ink:#E5EEEB; --muted:#93A5A1; --line:#2B3835;
  --accent:#4DC0B1; --accent-ink:#062421; --accent-soft:#163430;
  --ok:#6CC58F; --ok-soft:#173226; --warn:#E8A254; --warn-soft:#3A2913; --bad:#E57A7A; --bad-soft:#3B1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211F; --sunk:#1E2A27; --ink:#E5EEEB; --muted:#93A5A1; --line:#2B3835;
  --accent:#4DC0B1; --accent-ink:#062421; --accent-soft:#163430;
  --ok:#6CC58F; --ok-soft:#173226; --warn:#E8A254; --warn-soft:#3A2913; --bad:#E57A7A; --bad-soft:#3B1C1C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:18px;margin-bottom:10px}
h3{font-size:15px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num,.nums{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.nums{font-size:13px;color:var(--muted)}
section{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.note{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px}
.note.info{background:var(--accent-soft);color:var(--ink)}

/* botões */
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%;padding:12px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.cal button:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}

/* doses */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.dose{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.dose:first-child{border-top:0}
.dose-main{display:flex;flex-direction:column;min-width:0;flex:1}
.dose-main b{font-weight:600;overflow-wrap:anywhere}
.dose.is-done .dose-main b::after{content:" ✓";color:var(--ok)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:4px 9px;border-radius:999px}

/* frasco */
.vial{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vial-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vial-head h3{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:999px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

/* calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:1px solid transparent;background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);font:500 14px var(--f-body)}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal .dots i.plan{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.cal .dots i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.cal button.sel .dots i{box-shadow:0 0 0 1px var(--accent-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* tiles e tabelas */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:12px;color:var(--muted)}
.down{color:var(--ok)} .up{color:var(--warn)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.num{font-family:var(--f-mono)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 2px}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:10px var(--f-mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .pt.last{fill:var(--accent)}
.chart .val{fill:var(--ink);font:600 11px var(--f-mono)}
.chart .goal{stroke:var(--ok);stroke-width:1.4;stroke-dasharray:5 4}
.chart .goaltx{fill:var(--ok);font:600 10px var(--f-body)}

/* segmentado */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select{font:500 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.days{display:flex;gap:5px}
.days button{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prev{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.prev b{font-family:var(--f-mono);font-weight:500}

textarea{font:500 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:90px;resize:vertical}
.lnk{border:0;background:none;color:var(--accent);font:600 13px var(--f-body);padding:4px 0 0;cursor:pointer;text-align:left;align-self:flex-start}
.note-txt{font-size:13px;color:var(--ink);background:var(--sunk);border-radius:8px;padding:6px 9px;margin-top:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer}
.tags button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tagline span{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:999px}
.brand{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
/* termômetro IMC */
.gwrap{position:relative;padding-top:30px;padding-bottom:20px}
.gauge{display:flex;height:14px;border-radius:999px;overflow:hidden}
.gauge i{height:100%;display:block}
.gmark{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.gmark b{font:600 13px var(--f-mono);background:var(--ink);color:var(--bg);padding:1px 7px;border-radius:6px;white-space:nowrap}
.gmark i{width:3px;height:24px;background:var(--ink);border-radius:2px;display:block}
.gtick{position:absolute;bottom:0;transform:translateX(-50%);font:10px var(--f-mono);color:var(--muted)}
.cls{display:inline-block;font-weight:700;padding:3px 10px;border-radius:999px;font-size:13px}
.cls.ok{background:var(--ok-soft);color:var(--ok)}.cls.warn{background:var(--warn-soft);color:var(--warn)}.cls.bad{background:var(--bad-soft);color:var(--bad)}
.glegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.glegend span{display:inline-flex;align-items:center;gap:5px}
.glegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* exames */
.ex{cursor:pointer}
.ex:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spark{width:56px;height:20px;flex:none}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* treino */
.setrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;align-items:center}
.setrow span{font-size:12px;color:var(--muted)}
.setrow input{padding:8px 9px;text-align:center}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.daylist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px}
/* fotos */
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ba figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.ba img,.ba .ph-empty{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.ba .ph-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.ba figcaption{font-size:12px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal figure{margin:0;position:relative;min-width:0}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--sunk)}
.gal figcaption{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px;align-items:center;padding-top:3px}
.gal .x{border:0;background:none;color:var(--bad);font:600 11px var(--f-body);cursor:pointer;padding:2px}
.gal .x[data-armed]{background:var(--bad);color:#fff;border-radius:6px}
.file-btn{position:relative;overflow:hidden;text-align:center;display:block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:600 9.5px var(--f-body);letter-spacing:-.02em;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;border-radius:10px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}

/* folha (modal) */
.sheet{position:fixed;inset:0;background:rgba(8,14,13,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:50;max-width:90%}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
html,body{height:100%}
body{margin:0;font-size:15px}
img{max-width:100%}
.netbar{position:fixed;left:0;right:0;top:0;z-index:35;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-row img{width:52px;height:52px;border-radius:14px}
.brand-row h1{font-size:28px}
</style>
</head>
<body>
<div id="netbar" class="netbar" hidden></div>
<div id="auth" class="auth-wrap" hidden></div>

<main id="view" hidden><p class="muted">Carregando…</p></main>

<nav class="nav" aria-label="Seções" hidden><div id="nav">
  <button data-act="tab" data-tab="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Hoje</button>
  <button data-act="tab" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Agenda</button>
  <button data-act="tab" data-tab="peps"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-4 9a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3l-4-9V3"/><path d="M7.5 14h9"/></svg>Peptídeos</button>
  <button data-act="tab" data-tab="peso"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Peso</button>
  <button data-act="tab" data-tab="corpo"><svg viewBox="0 0 24 24"><path d="M3 9l3-3 15 15-3 3z"/><path d="M8 8l2-2M11 11l2-2M14 14l2-2"/></svg>Corpo</button>
  <button data-act="tab" data-tab="exames"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>Exames</button>
  <button data-act="tab" data-tab="treino"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Treino</button>
  <button data-act="tab" data-tab="supl"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="6" rx="3" transform="rotate(-40 12 12)"/><path d="M9.5 8.8l5 6.4"/></svg>Suplem.</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script>
(function(){
const PCOL=['#1F9E8F','#D9822B','#6B6FD8','#C2477A','#5E9E3A','#2E86C1','#B8902A'];
const WD=['D','S','T','Q','Q','S','S'], WDN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MEAS=[['pescoco','Pescoço'],['ombros','Ombros'],['peito','Peito'],['bracoD','Braço dir.'],['bracoE','Braço esq.'],['cintura','Cintura'],['abdomen','Abdômen (umbigo)'],['quadril','Quadril'],['coxaD','Coxa dir.'],['coxaE','Coxa esq.'],['pantD','Panturrilha dir.'],['pantE','Panturrilha esq.'],['gordura','% de gordura']];
const POSES=['Frente','Lado','Costas'];
const TAGS=['Sem efeitos','Menos fome','Mais energia','Náusea','Vômito','Azia/refluxo','Intestino preso','Diarreia','Cansaço','Dor de cabeça','Insônia','Tontura','Reação no local'];

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};

const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};

const colr=p=>p.color||PCOL[0];
const conc=p=>p.mg/p.ml;
const uiOf=(p,mg)=>mg/conc(p)*100;
const mlOf=(p,mg)=>mg/conc(p);
const vialN=p=>p.vial||1;
const isPen=p=>p.device==='caneta';

function doseAt(p,s){let d=p.dose;stepsOf(p).forEach(x=>{if(x.d<=s)d=x.mg});return d}
const needAt=(p,s)=>doseAt(p,s)+primeMg(p);

function uiLabel(p,mg){const u=uiOf(p,mg);if(!isPen(p))return f(u,1)+' UI';const st=stepOf(p),r=Math.round(u/st)*st;
  return Math.abs(r-u)<.01?f(r,1)+' UI na caneta':f(r,1)+' UI na caneta (≈'+f(r/100*conc(p),3)+' mg)'}
const used=p=>(p.log||[]).filter(l=>l.v===vialN(p)).reduce((a,l)=>a+l.mg+(l.pr||0),0);
const rem=p=>Math.max(0,p.mg-used(p));
const sched=(p,s)=>!p.paused&&(p.days||[]).includes(pd(s).getDay())&&(!p.start||s>=p.start);
const taken=(p,s)=>(p.log||[]).find(l=>l.d===s);

function forecast(p){
  if(!(p.dose>0)||!(p.days||[]).length||p.paused)return null;
  let cur=rem(p),stock=p.stock||0,n=0,curN=0,last=null,curDone=false,s=today();
  for(let i=0;i<1100;i++,s=addD(s,1)){
    if(!sched(p,s)||taken(p,s))continue;
    const nd=needAt(p,s);
    if(cur+1e-9<nd){curDone=true;if(stock>0){stock--;cur+=p.mg}else return{n,curN,last,runOut:s}}
    cur-=nd;n++;if(!curDone)curN++;last=s;
  }
  return{n,curN,last,runOut:null};
}

  <div class="bar" style="--c:${colr(p)}" role="img" aria-label="${Math.round(pct*100)}% restante"><i style="width:${(pct*100).toFixed(1)}%"></i></div>
  <div class="facts"><div class="fact"><span>Frasco atual (nº ${vialN(p)})</span><b>${f(r,2)} / ${f(p.mg,2)} mg</b></div>
  <div class="fact"><span>Aplicações ${isPen(p)?'neste refil':'neste frasco'}</span><b>${F?F.curN:Math.floor(r/(need(p)||Infinity))||0}</b></div>
  <div class="fact"><span>Frascos em estoque</span><b>${p.stock||0}</b></div>
  <div class="fact"><span>Restante ${isPen(p)?'no refil':'no frasco'}</span><b>${f(r/conc(p),2)} mL · ${f(r/conc(p)*100,0)} UI</b></div></div>
  <p class="small muted">${line}</p></div>`;
}

function rHoje(){
  const t=today(),due=peps.filter(p=>sched(p,t)||taken(p,t));
  let h=`<header class="row between"><div><p class="eyebrow">${cap(fdl(t))}</p><h1>Hoje</h1></div><div class="row" style="gap:6px"><button class="btn sm" data-act="report">Resumo médico</button><button class="btn sm" data-act="account">Conta</button></div></header><section><h2>Doses de hoje</h2>`;
  if(!peps.length)h+=emptyPeps();
  else if(!due.length){
    const nx=peps.map(p=>[p,nextDose(p,addD(t,1))]).filter(x=>x[1]).sort((a,b)=>a[1]<b[1]?-1:1)[0];
    h+=`<p class="muted">Nada programado hoje.${nx?` Próxima: <b>${esc(nx[0].name)}</b> em ${fdl(nx[1])}.`:''}</p>`;
  } else h+=`<div class="list">${due.map(p=>doseRow(p,t)).join('')}</div>`;
  h+='</section>';
  if(peps.length)h+=`<section><h2>Estoque e reposição</h2><div class="stack">${peps.map(stockCard).join('')}</div></section>`;
  if(weight.start){const S=wSeries(),c=S[S.length-1],d=c.kg-weight.start.kg;
    h+=`<section><h2>Peso</h2><div class="tiles"><div class="tile"><span>Atual</span><b>${f(c.kg,1)} kg</b><small>${fdy(c.d)}</small></div><div class="tile"><span>Desde o início</span><b class="${cls(d)}">${fs(d)} kg</b><small>${fs(d/weight.start.kg*100)}%</small></div></div></section>`}
  return h+`<p class="foot">UI no padrão U-100 (1 mL = 100 UI), igual para caneta e seringa de insulina. Confira sempre doses com o seu médico.</p>`;
}

function rAgenda(){

    const s=ds(new Date(y,mo,d));

  <div class="legend"><span><i style="background:var(--accent)"></i>Aplicado</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--accent)"></i>Programado</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--bad)"></i>Não marcado</span></div></section>
  <section><h2>${cap(fdl(sel))}</h2>${det}${peps.length?'':'<div style="margin-top:10px">'+emptyPeps()+'</div>'}</section>
  <p class="foot">Os dias de cada peptídeo são escolhidos no cadastro, na aba Peptídeos.</p>`;

function rPeps(){

    <div class="fact"><span>Dose atual</span><b>${f(doseAt(p,today()),3)} mg · ${uiLabel(p,doseAt(p,today()))}</b></div><div class="fact"><span>Volume por dose</span><b>${f(mlOf(p,doseAt(p,today())),3)} mL</b></div>
    <div class="fact"><span>Aplicação</span><b>${isPen(p)?'Caneta · clique '+f(stepOf(p),1)+' UI':'Seringa U-100'}</b></div>${isPen(p)?`<div class="fact"><span>Purga por aplicação</span><b>${f(p.prime||0,1)} UI</b></div>`:''}</div>

/* ---------- gráfico ---------- */
function chart(pts,o){
  o=o||{};if(!pts.length)return '';
  const W=340,H=190,L=40,R=16,T=18,B=24,xs=pts.map(p=>pd(p.d).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  let vs=pts.map(p=>p.v);if(o.goal!=null)vs=vs.concat(o.goal);
  let lo=Math.min(...vs),hi=Math.max(...vs);const pv=Math.max((hi-lo)*.12,.5);lo-=pv;hi+=pv;
  const X=t=>x1===x0?L+(W-L-R)/2:L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v).toFixed(1);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${f(v,1)}</text>`}
  const P=pts.map((p,i)=>[X(xs[i]),Y(p.v)]);
  const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  if(P.length>1)g+=`<path class="ar" d="${line} L${P[P.length-1][0].toFixed(1)} ${H-B} L${P[0][0].toFixed(1)} ${H-B} Z"/><path class="ln" d="${line}"/>`;
  if(o.goal!=null){const y=Y(o.goal).toFixed(1);g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="goaltx" x="${W-R}" y="${(y-4).toFixed(1)}" text-anchor="end">meta ${f(o.goal,1)}</text>`}
  P.forEach((q,i)=>{g+=`<circle class="pt${i===P.length-1?' last':''}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===P.length-1?4.5:3}"/>`});
  const lq=P[P.length-1],anc=lq[0]>W-60?'end':lq[0]<L+30?'start':'middle';
  g+=`<text class="val" x="${lq[0].toFixed(1)}" y="${(lq[1]-9).toFixed(1)}" text-anchor="${anc}">${f(pts[pts.length-1].v,1)}</text>`;
  g+=`<text class="ax" x="${L}" y="${H-6}" text-anchor="start">${fd(pts[0].d)}</text>`;
  if(pts.length>1)g+=`<text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${fd(pts[pts.length-1].d)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico')}">${g}</svg></div>`;
}

/* ---------- peso ---------- */
function wSeries(){
  if(!weight.start)return[];
  const a=[{d:weight.start.d,kg:weight.start.kg,start:true}].concat(weight.entries.filter(e=>e.d>=weight.start.d));
  return a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.start?-1:1));
}
const monday=s=>{const d=pd(s),w=(d.getDay()+6)%7;return addD(s,-w)};
function groupLast(S,keyFn){const m=new Map();S.forEach(e=>m.set(keyFn(e.d),e));return [...m.entries()]}

function rPeso(){
  let h=`<header class="row between"><div><p class="eyebrow">Acompanhamento</p><h1>Peso</h1></div>${weight.start?'<button class="btn sm" data-act="wsetup">Início e meta</button>':''}</header>`;
  if(!weight.start)return h+`<div class="vial"><h3>Comece pelo peso inicial</h3><p class="muted small">Depois registre o peso uma vez por semana, de preferência no mesmo dia e horário (em jejum, ao acordar).</p><button class="btn primary" data-act="wsetup">Definir peso inicial</button></div>`;
  const S=wSeries(),c=S[S.length-1],st=weight.start,dt=c.kg-st.kg,wk=diffD(st.d,c.d)/7,rate=wk>=1?dt/wk:null,g=weight.goal;
  const last4=S.filter(e=>e.d>=addD(c.d,-28)),r4=last4.length>1&&diffD(last4[0].d,c.d)>=7?(c.kg-last4[0].kg)/(diffD(last4[0].d,c.d)/7):null;
  let goalTile='';
  if(g!=null){const falta=c.kg-g;let proj='';const rr=r4!=null?r4:rate;
    if(falta>0&&rr!=null&&rr<0)proj=`previsão ${fdy(addD(c.d,Math.round(falta/-rr*7)))}`;else if(falta<=0)proj='meta atingida';
    goalTile=`<div class="tile"><span>Falta para a meta</span><b>${falta>0?f(falta,1):'0'} kg</b><small>${proj||'meta '+f(g,1)+' kg'}</small></div>`}
  const imc='';
  let how='';
  if(S.length<2)how='Registre o próximo peso daqui a uma semana para ver a tendência.';
  else{const rr=r4!=null?r4:rate;how=rr==null?`Variação até agora: ${fs(dt)} kg.`:rr<0?`Você está perdendo em média ${f(-rr,2)} kg por semana${r4!=null?' nas últimas 4 semanas':''}.`:rr>0?`Nas últimas semanas o peso subiu em média ${f(rr,2)} kg por semana.`:'Peso estável nas últimas semanas.'}
  h+=`<section class="stack"><div class="tiles"><div class="tile"><span>Atual</span><b>${f(c.kg,1)} kg</b><small>${fdy(c.d)}</small></div>
  <div class="tile"><span>Desde o início</span><b class="${cls(dt)}">${fs(dt)} kg</b><small>${fs(dt/st.kg*100)}% · ${f(st.kg,1)} kg em ${fdy(st.d)}</small></div>
  <div class="tile"><span>Ritmo médio</span><b class="${cls(rate)}">${rate==null?'–':fs(rate,2)}</b><small>kg por semana</small></div>${goalTile}${imc}</div>
  <p class="note info">${how}</p>${chart(S.map(e=>({d:e.d,v:e.kg})),{goal:g,label:'Evolução do peso'})}</section>`;
  h+=`<section><h2>Registrar peso</h2><div class="grid2"><label class="f">Data<input id="w-d" type="date" value="${today()}"></label><label class="f">Peso (kg)<input id="w-kg" inputmode="decimal" placeholder="${f(c.kg,1)}"></label></div><button class="btn primary block" style="margin-top:10px" data-act="wadd">Registrar</button></section>`;
  h+=imcSec(c)+metasSec(c);
  const rows=ui.wview==='sem'?groupLast(S,monday):groupLast(S,d=>d.slice(0,7));
  let tr='';for(let i=rows.length-1;i>=0;i--){const [k,e]=rows[i],pv=i?rows[i-1][1].kg:null,d=pv==null?null:e.kg-pv,acc=e.kg-st.kg;
    const lab=ui.wview==='sem'?'Sem. '+fd(k):cap(pd(k+'-01').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''));
    tr+=`<tr><td>${lab}</td><td class="num">${f(e.kg,1)}</td><td class="num ${cls(d)}">${d==null?'início':fs(d)}</td><td class="num ${cls(acc)}">${fs(acc)}</td></tr>`}
  h+=`<section><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Resumo</h2><div class="seg" style="width:180px"><button class="${ui.wview==='sem'?'on':''}" data-act="wview" data-v="sem">Semana</button><button class="${ui.wview==='mes'?'on':''}" data-act="wview" data-v="mes">Mês</button></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>${ui.wview==='sem'?'Semana':'Mês'}</th><th>kg</th><th>Variação</th><th>Total</th></tr></thead><tbody>${tr}</tbody></table></div></section>`;
  const ent=weight.entries.slice().sort((a,b)=>a.d<b.d?1:-1);
  if(ent.length)h+=`<section><h2>Registros</h2><div class="list">${ent.map(e=>`<div class="dose"><div class="dose-main"><b>${f(e.kg,1)} kg</b><span class="nums">${cap(fdl(e.d))}</span></div><button class="btn sm danger" data-act="wdel" data-k="${e.k}">Apagar</button></div>`).join('')}</div></section>`;
  return h;
}

const ACTS=[[1.2,'Sedentário (pouco ou nenhum exercício)'],[1.375,'Leve (exercício 1 a 3x por semana)'],[1.55,'Moderado (3 a 5x por semana)'],[1.725,'Intenso (6 a 7x por semana)'],[1.9,'Muito intenso (2 treinos por dia ou trabalho físico)']];
function imcClass(v){return v<18.5?['Abaixo do peso','warn']:v<25?['Peso normal','ok']:v<30?['Sobrepeso','warn']:v<35?['Obesidade grau I','bad']:v<40?['Obesidade grau II','bad']:['Obesidade grau III','bad']}
function imcSec(c){
  if(!weight.height)return `<section><h2>IMC</h2><div class="vial"><p class="small muted">Informe sua altura em “Início e meta” para ver o IMC e a faixa de peso ideal.</p><button class="btn sm" style="align-self:flex-start" data-act="wsetup">Informar altura</button></div></section>`;
  const hm=weight.height/100,h2=hm*hm,v=c.kg/h2,v0=weight.start.kg/h2,[lab,k]=imcClass(v);
  const pos=x=>((Math.min(45,Math.max(15,x))-15)/30*100).toFixed(1);
  const seg=(a,b,col)=>`<i style="width:${((b-a)/30*100).toFixed(2)}%;background:var(--${col})"></i>`;
  let tip;
  if(v>=30)tip=`Para sair da faixa de obesidade (IMC abaixo de 30): <b class="num">${f(29.9*h2,1)} kg</b>. Para o peso normal (IMC abaixo de 25): <b class="num">${f(24.9*h2,1)} kg</b>, ${f(c.kg-24.9*h2,1)} kg a menos.`;
  else if(v>=25)tip=`Para o peso normal (IMC abaixo de 25): <b class="num">${f(24.9*h2,1)} kg</b>, ${f(c.kg-24.9*h2,1)} kg a menos.`;
  else if(v>=18.5)tip=`Você está na faixa saudável. Para sua altura ela vai de <b class="num">${f(18.5*h2,1)}</b> a <b class="num">${f(24.9*h2,1)} kg</b>.`;
  else tip=`Abaixo da faixa saudável, que começa em <b class="num">${f(18.5*h2,1)} kg</b> para sua altura. Vale conversar com seu médico.`;
  let waist='';const cw=mFL('cintura');
  if(cw&&weight.sex){const w=cw[1].v.cintura,lim=weight.sex==='F'?[80,88]:[94,102],wk=w>=lim[1]?'bad':w>=lim[0]?'warn':'ok';
    waist=`<p class="small">Cintura: <b class="num">${f(w,1)} cm</b> <span class="cls ${wk}">${wk==='ok'?'Risco baixo':wk==='warn'?'Risco aumentado':'Risco alto'}</span> <span class="muted">(referência ${weight.sex==='F'?'mulheres: até 80 cm':'homens: até 94 cm'})</span></p>`}
  return `<section class="stack"><div class="row between"><h2 style="margin:0">IMC</h2><span class="cls ${k}">${lab}</span></div>
  <div class="vial"><div class="gwrap" role="img" aria-label="IMC ${f(v,1)}, ${lab}">
    <div class="gmark" style="left:${pos(v)}%"><b>${f(v,1)}</b><i></i></div>
    <div class="gauge">${seg(15,18.5,'warn')}${seg(18.5,25,'ok')}${seg(25,30,'warn')}${seg(30,45,'bad')}</div>
    ${[18.5,25,30,35,40].map(t=>`<span class="gtick" style="left:${pos(t)}%">${f(t,1)}</span>`).join('')}</div>
  <div class="glegend"><span><i style="background:var(--ok)"></i>Normal 18,5–24,9</span><span><i style="background:var(--warn)"></i>Abaixo ou sobrepeso</span><span><i style="background:var(--bad)"></i>Obesidade 30+</span></div>
  <p class="small">${tip}</p>${Math.abs(v0-v)>=.05?`<p class="small muted">No início você estava com IMC ${f(v0,1)} (${imcClass(v0)[0].toLowerCase()}).</p>`:''}${waist}
  <p class="foot">O IMC é o peso dividido pela altura ao quadrado. É uma referência rápida e não separa músculo de gordura, por isso vale acompanhar junto com a cintura.</p></div></section>`;
}
function metasSec(c){
  const w=c.kg,hm=weight.height?weight.height/100:null;let ref=w,refTxt='do seu peso atual';
  if(hm&&w/(hm*hm)>=30){ref=25*hm*hm;refTxt=`de um peso de referência de ${f(ref,0)} kg (IMC 25), já que acima de IMC 30 o peso total superestima a necessidade`}
  const water=w*.035,prot=ref*1.6,fib=weight.sex==='F'?25:30;
  let kc='';
  const age=weight.birth?Math.floor(diffD(weight.birth,today())/365.25):null;
  if(weight.sex&&age&&weight.height&&weight.act){
    const bmr=10*w+6.25*weight.height-5*age+(weight.sex==='F'?-161:5),tdee=bmr*weight.act,floor=weight.sex==='F'?1200:1500,eat=Math.max(floor,tdee-500),def=tdee-eat;
    kc=`<div class="tile"><span>Gasto diário estimado</span><b>${f(Math.round(tdee/10)*10,0)}</b><small>kcal · metabolismo basal ${f(Math.round(bmr/10)*10,0)}</small></div>
    <div class="tile"><span>Consumo para emagrecer</span><b>${f(Math.round(eat/10)*10,0)}</b><small>kcal/dia · ≈ ${f(def*7/7700,2)} kg por semana</small></div>`;
  } else kc=`<div class="tile" style="grid-column:1/-1"><span>Calorias</span><small style="margin-top:4px">Informe sexo, data de nascimento, altura e nível de atividade em “Início e meta” para calcular gasto e consumo.</small><button class="btn sm" style="margin-top:8px" data-act="wsetup">Completar dados</button></div>`;
  return `<section class="stack"><h2 style="margin:0">Metas diárias</h2><div class="tiles">
  <div class="tile"><span>Água</span><b>${f(water,1)} L</b><small>≈ ${Math.round(water/.25)} copos de 250 mL</small></div>
  <div class="tile"><span>Proteína</span><b>${f(Math.round(prot/5)*5,0)} g</b><small>faixa ${f(Math.round(ref*1.2/5)*5,0)}–${f(Math.round(ref*2/5)*5,0)} g</small></div>
  <div class="tile"><span>Fibra</span><b>${fib} g</b><small>faixa 25–38 g</small></div>${kc}</div>
  <p class="foot">Água: 35 mL por kg. Proteína: 1,6 g por kg ${refTxt}. Calorias pela fórmula de Mifflin-St Jeor, com déficit de 500 kcal e piso de ${weight.sex==='F'?'1.200':'1.500'} kcal. Com peptídeo e menos fome, bater a proteína ajuda a perder gordura e não músculo. São estimativas: ajuste com seu médico ou nutricionista.</p></section>`;
}

const EX=[
 {k:'glic',n:'Glicose em jejum',u:'mg/dL',why:'Os peptídeos baixam a glicose. Acompanhar mostra o efeito e ajuda a evitar hipoglicemia.'},
 {k:'a1c',n:'Hemoglobina glicada (HbA1c)',u:'%',why:'Média da glicose dos últimos 3 meses. Mostra a tendência melhor que a glicose de um dia.'},

function evalEx(k,v){const F=weight.sex==='F',M=weight.sex==='M';

function pdfTable(doc,st,head,rows,np,INK,HEAD){doc.setFontSize(8.5);const W=st.W,n=head.length,pad=3,lh=3.75;

  else{ws=mx.map(w=>Math.min(w,W/n));const rest=W-ws.reduce((a,b)=>a+b,0),nd=mx.map((w,i)=>w-ws[i]),tn=nd.reduce((a,b)=>a+b,0);ws=ws.map((w,i)=>w+(tn?rest*nd[i]/tn:0))}
  const row=(cells,hd)=>{doc.setFont('helvetica',hd?'bold':'normal');const L=cells.map((c,i)=>doc.splitTextToSize(clean(c),ws[i]-pad)),h=Math.max(...L.map(l=>l.length))*lh+2.6;

function topOf(it,c){if(c)return it.min;const s=it.sets||[],k=s.map(z=>z.kg).filter(v=>v!=null);return k.length?Math.max(...k):s.length?Math.max(...s.map(z=>z.r||0)):null}

function mFL(key){const E=meas.entries.filter(e=>e.v&&e.v[key]!=null).sort((a,b)=>a.d<b.d?-1:1);return E.length?[E[0],E[E.length-1],E]:null}
function rCorpo(){
  let h=`<header><p class="eyebrow">Medidas e fotos</p><h1>Corpo</h1></header><div class="seg"><button class="${ui.ctab==='medidas'?'on':''}" data-act="ctab" data-v="medidas">Medidas</button><button class="${ui.ctab==='fotos'?'on':''}" data-act="ctab" data-v="fotos">Fotos antes e depois</button></div>`;
  return h+(ui.ctab==='medidas'?rMedidas():rFotos());
}
function rMedidas(){
  const E=meas.entries.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(!E.length)return `<div class="vial"><h3>Nenhuma medição ainda</h3><p class="muted small">Use fita métrica, sem apertar, sempre no mesmo horário. Cintura: na parte mais fina. Abdômen: na linha do umbigo. Quadril: na parte mais larga do glúteo. Braço: no meio, relaxado. Coxa: no ponto mais grosso. Meça a cada 2 a 4 semanas.</p><button class="btn primary" data-act="newmeas">Primeira medição</button></div>`;
  let tr='';MEAS.forEach(([k,n])=>{const r=mFL(k);if(!r)return;const[a,b]=r,d=b.v[k]-a.v[k],u=k==='gordura'?'%':'';
    tr+=`<tr><td>${n}</td><td class="num">${f(a.v[k],1)}${u}</td><td class="num">${f(b.v[k],1)}${u}</td><td class="num ${cls(d)}">${a===b?'–':fs(d)}</td></tr>`});
  const opts=MEAS.filter(([k])=>mFL(k)).map(([k,n])=>`<option value="${k}" ${k===ui.msel?'selected':''}>${n}</option>`).join('');
  if(!mFL(ui.msel)){const first=MEAS.find(([k])=>mFL(k));if(first)ui.msel=first[0]}
  const ser=mFL(ui.msel);
  let h=`<section><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Comparativo</h2><button class="btn primary sm" data-act="newmeas">+ Nova medição</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Medida (cm)</th><th>${fdy(E[0].d)}</th><th>${fdy(E[E.length-1].d)}</th><th>Diferença</th></tr></thead><tbody>${tr}</tbody></table></div></section>`;
  h+=`<section><h2>Evolução</h2><label class="f" style="margin-bottom:10px">Medida<select id="m-sel">${opts}</select></label>${ser?chart(ser[2].map(e=>({d:e.d,v:e.v[ui.msel]})),{label:'Evolução da medida'}):''}</section>`;
  h+=`<section><h2>Histórico</h2><div class="list">${E.slice().reverse().map(e=>`<div class="dose"><div class="dose-main"><b>${cap(fdl(e.d))}</b><span class="nums">${Object.keys(e.v||{}).length} medidas</span></div><button class="btn sm" data-act="editmeas" data-k="${e.k}">Editar</button></div>`).join('')}</div></section>`;
  return h;
}
const img=id=>phURL[id]&&phURL[id].exp>Date.now()?phURL[id].url:'';
const imgA=id=>`data-ph="${esc(id)}"${img(id)?` src="${img(id)}"`:''}`;
function rFotos(){
  const P=photos.items.slice().sort((a,b)=>a.d<b.d?-1:1),pose=ui.ba.pose,of=P.filter(p=>p.pose===pose);

  <p class="note" id="ph-status" ${phStatus?'':'hidden'}>${esc(phStatus)}</p>
  <p class="foot">Dica: mesma luz, mesma distância e mesma roupa em todas as fotos.</p></section>`;
  h+=`<section class="stack"><div class="row between"><h2 style="margin:0">Antes e depois</h2><div class="seg" style="width:210px">${POSES.map(x=>`<button class="${x===pose?'on':''}" data-act="bapose" data-v="${x}">${x}</button>`).join('')}</div></div>
  ${of.length>1?`<div class="grid2"><label class="f">Antes${sel('ba-a',a)}</label><label class="f">Depois${sel('ba-b',b)}</label></div>`:''}
  <div class="ba">${fig(a,'Antes')}${fig(of.length>1?b:null,'Depois')}</div>${a&&b&&a!==b?`<p class="small muted">${diffD(a.d,b.d)} dias entre as fotos.</p>`:''}</section>`;
  if(P.length)h+=`<section><h2>Todas as fotos</h2><div class="gal">${P.slice().reverse().map(p=>`<figure><img ${imgA(p.a)} alt="${p.pose} ${fdy(p.d)}" loading="lazy"><figcaption><span>${fd(p.d)} · ${p.pose}</span><button class="x" data-act="phdel" data-a="${esc(p.a)}">Apagar</button></figcaption></figure>`).join('')}</div></section>`;
  return h+`<p class="foot">As fotos ficam num espaço privado da sua conta. Só você tem acesso a elas.</p>`;
}

function pfCalc(src){
  const mg=num($('#pf-mg').value),ml=num($('#pf-ml').value),pv=$('#pf-prev');
  if(!(mg>0&&ml>0)){pv.textContent='Preencha mg e mL para ver a concentração.';return}
  const c=mg/ml;
  if(src==='ui'){const u=num($('#pf-ui').value);if(u!=null)$('#pf-dose').value=f(u/100*c,4)}
  else{const d=num($('#pf-dose').value);$('#pf-ui').value=d!=null?f(d/c*100,1):''}
  const d=num($('#pf-dose').value),pen=$('#pf-dev').value==='caneta',st=num($('#pf-step').value)||1,pr=pen?(num($('#pf-prime').value)||0):0;
  let t=`Concentração <b>${f(c,3)} mg/mL</b>`;
  if(d>0){const u=d/c*100,r=Math.round(u/st)*st,per=d+pr/100*c;
    t+=` · cada dose = <b>${f(u,1)} UI</b> (${f(d/c,3)} mL)`;
    if(pen&&Math.abs(r-u)>.01)t+=`<br>Na caneta dá para marcar <b>${f(r,1)} UI</b>, que equivale a ${f(r/100*c,3)} mg.`;
    if(pr>0)t+=`<br>Com a purga, cada aplicação gasta ${f(u+pr,1)} UI.`;
    t+=`<br>Rende <b>${Math.floor(mg/per+1e-9)}</b> aplicações por ${pen?'refil':'frasco'}.`}
  if(pen&&ml>3)t+=`<br><span style="color:var(--warn)">O refil da caneta comporta até 3 mL. Com ${f(ml)} mL não cabe tudo.</span>`;
  pv.innerHTML=t;
}

  if(i==='sf-dos'||i==='sf-qty'||i==='sf-times'){sfPrev();return}
  if(e.target.classList.contains('st-mg')){const s=e.target.closest('.steprow').querySelector('.st-ui');s.textContent=stepUI(num(e.target.value));return}
  if(i==='pf-mg'||i==='pf-ml')PN.querySelectorAll('.steprow').forEach(r=>{r.querySelector('.st-ui').textContent=stepUI(num(r.querySelector('.st-mg').value))});if(i==='pf-mg'||i==='pf-ml'||i==='pf-dose'||i==='pf-prime')pfCalc('mg');else if(i==='pf-ui')pfCalc('ui')});
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='tr-day'){ui.tday=+e.target.value;render();return}
  if(id==='wk-d'){if(ui.wk){ui.wk.d=e.target.value;saveDraft()}return}
  if(id==='pk-g'){pkList();return}
  if(id==='imp-file'){const file=e.target.files&&e.target.files[0];if(!file)return;
    try{const o=JSON.parse(await file.text());if(!o||o.app!=='diario-peptideos'||!o.docs)throw 0;sheetCtx.imp=o;
      const D=o.docs,np=Object.keys(D).filter(k=>k.startsWith('pep-')).length,nw=(D.weight&&D.weight.entries||[]).length,nm=(D.meas&&D.meas.entries||[]).length,nt=Object.keys(D).filter(k=>k.startsWith('tr-')).length,ns=(D.supl&&D.supl.items||[]).length,nf=(o.photos||[]).length;
      bkSay(`<div class="vial"><b>Backup de ${o.at?fdy(o.at.slice(0,10)):'data desconhecida'}</b><p class="small">${np} peptídeo(s) · ${nw} registro(s) de peso · ${nm} medição(ões) · ${nt} treino(s) · ${ns} suplemento(s) · ${nf} foto(s)</p><p class="small" style="color:var(--warn)">Os dados deste backup substituem os dados atuais das mesmas partes.</p><button class="btn primary block" data-act="bkimp">Importar agora</button></div>`)}
    catch(err){bkSay('<p class="note">Esse arquivo não é um backup do Diário de Peptídeos.</p>')}
    e.target.value='';return}
  if(id==='sf-unit'||id==='sf-form'){sfPrev();return}
  if(id==='pf-dev'){$('#pf-pen').hidden=e.target.value!=='caneta';pfCalc('mg')}
  else if(id==='pf-step')pfCalc('mg');
  else if(id==='m-sel'){ui.msel=e.target.value;render()}
  else if(id==='ba-a'){ui.ba.a=e.target.value;render()}
  else if(id==='ba-b'){ui.ba.b=e.target.value;render()}
  else if(id==='ph-pose'){ui.ba={pose:e.target.value,a:null,b:null};render()}
  else if(id==='ph-file'){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const d=$('#ph-d').value||today(),pose=$('#ph-pose').value,lab=$('#ph-lab');
    const st=m=>{phStatus=m;const el=$('#ph-status');if(el){el.textContent=m;el.hidden=!m}};
    lab.firstChild.textContent='Salvando…';st('Preparando a foto…');
    let src;try{src=await decode(file)}catch(err){st('Não consegui abrir essa imagem. Se for HEIC, mude a câmera para JPG ("Mais compatível") ou envie um print da foto.');lab.firstChild.textContent='Escolher ou tirar foto';return}
    try{st('Enviando…');const blob=await toBlob(src,1600,.85),path=me.id+'/'+uid()+'.jpg';
      const {error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
      photos.items.push({a:path,d,pose})}
    catch(err){st('Não consegui salvar a foto ('+(err&&err.message||'erro')+'). Confira a internet e tente de novo.');lab.firstChild.textContent='Escolher ou tirar foto';return}
    putPh();ui.ba={pose,a:null,b:null};phStatus='';render();toast('Foto salva');
  }
});
function decode(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>{
    if(window.createImageBitmap)createImageBitmap(file).then(res,rej);else rej(new Error('formato'))};im.src=u});
}
function draw(src,max){const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function toBlob(src,max,q){const c=draw(src,max);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:'blob'}),'image/jpeg',q))}
function toSmallURL(src){for(const[max,q]of[[1100,.72],[900,.65],[750,.55],[600,.5]]){const u=draw(src,max).toDataURL('image/jpeg',q);if(u.length<230000)return u}throw{code:'muito_grande'}}
boot();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
